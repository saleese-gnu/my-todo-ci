name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 단위 테스트
        run: node --test